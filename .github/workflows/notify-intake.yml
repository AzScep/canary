name: Notify intake

# Sends app-release.v1 to AzScep/deployment-script once a release run on main has completed
# successfully. The payload names only the app and the run; intake reads everything else back
# from this repository with its own read-only token. Runs from the default branch's copy of this
# file, so a pull request cannot change it.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.path == '.github/workflows/release.yml'
        && github.event.workflow_run.head_repository.full_name == 'AzScep/canary'
        && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The token is an environment secret, readable only by jobs this environment's deployment
    # branch rule allows (main), not by every workflow in the repository.
    environment: intake-dispatch
    steps:
      - name: Send app-release.v1 to the platform intake
        env:
          # A fine-grained token limited to AzScep/deployment-script. A repository dispatch needs
          # Contents write, so a leaked token could push to that repository; it is not the Release
          # App, so it cannot write records the apply workflow trusts. See README, One-time setup.
          GH_TOKEN: ${{ secrets.INTAKE_DISPATCH_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "invalid run id: $RUN_ID" >&2; exit 1; }
          [[ -n "$GH_TOKEN" ]] || { echo 'INTAKE_DISPATCH_TOKEN is not set' >&2; exit 1; }
          payload=$(jq -cn --arg runId "$RUN_ID" '{event_type: "app-release.v1", client_payload: {app: "canary", runId: $runId}}')
          # Intake treats a repeated dispatch of one run as already accepted, so retrying is safe.
          for attempt in 1 2 3; do
            if gh api --method POST repos/AzScep/deployment-script/dispatches --input - <<<"$payload"; then
              echo "Sent app-release.v1 for run $RUN_ID"
              exit 0
            fi
            echo "dispatch attempt $attempt failed" >&2
            sleep $((attempt * 10))
          done
          exit 1
